<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting…</title>
  <meta http-equiv="refresh" content="0; url=index.html">
  <script>
    (function () {
      try {
        var params = new URLSearchParams(window.location.search);
        var lang = (params.get('lang') || '').toLowerCase();
        var supported = ['bs', 'de', 'en', 'es', 'it', 'fr'];
        var target = new URL('index.html', window.location.href);
        if (supported.indexOf(lang) !== -1) target.searchParams.set('lang', lang);
        window.location.replace(target.pathname + target.search + target.hash);
      } catch (_err) {
        window.location.replace('index.html');
      }
    })();
  </script>
</head>
<body>
  <p>Redirecting to <a href="index.html">index.html</a>…</p>
</body>
</html>
