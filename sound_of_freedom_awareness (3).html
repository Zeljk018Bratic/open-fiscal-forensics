<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Sound of Freedom — Zašto ništa ne znaš o ovome?</title>
<meta id="meta-desc" name="description" content="300.000 nestale djece. Dokumentovano. Zvanični izvještaji. Zašto to nije na naslovnim stranama?">
<meta id="og-title" property="og:title" content="Sound of Freedom — Zašto ništa ne znaš o ovome?">
<meta id="og-desc" property="og:description" content="300.000 nestale djece. Dokumentovano. Zvanični izvještaji. Zašto to nije na naslovnim stranama?">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔗</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Source+Sans+3:wght@300;400;600&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --black: #0a0a0a;
  --white: #f4f0e8;
  --red: #c0392b;
  --gold: #d4a017;
  --grey: #2a2a2a;
  --light-grey: #888;
  --accent: #e8d5b0;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  background: var(--black);
  color: var(--white);
  font-family: 'Source Sans 3', sans-serif;
  font-weight: 300;
  overflow-x: hidden;
}

/* DOCUMENT MODE */
body.doc-mode {
  background: #f5f5f0;
  color: #111;
  font-family: 'Courier Prime', monospace;
}
body.doc-mode .hero {
  background: #f5f5f0;
  border-bottom: 2px solid #111;
}
body.doc-mode .hero::before { display: none; }
body.doc-mode .hero-counter { color: #111; text-shadow: none; }
body.doc-mode .hero-unit { color: #444; }
body.doc-mode .hero-title { color: #111; }
body.doc-mode .hero-title em { color: #111; text-decoration: underline; font-style: italic; }
body.doc-mode .hero-sub { color: #333; }
body.doc-mode p { color: #222; }
body.doc-mode h2 { color: #111; }
body.doc-mode .stat-box { background: #eee; }
body.doc-mode .stat-box:hover { background: #e5e5e0; }
body.doc-mode .stat-num { color: #111; }
body.doc-mode .stat-label { color: #444; }
body.doc-mode .blockquote { background: #e8e8e3; border-left-color: #111; }
body.doc-mode .blockquote p { color: #111; }
body.doc-mode .link-card { background: #eee; border-color: #ccc; color: #111; }
body.doc-mode .link-card:hover { background: #e0e0db; border-color: #888; }
body.doc-mode .link-title { color: #111; }
body.doc-mode .link-tag { color: #555; }
body.doc-mode .warning-box { background: #e8e4d8; border-color: #555; }
body.doc-mode .section-label { color: #555; }
body.doc-mode .lang-bar { background: #e8e8e3; border-bottom-color: #ccc; }
body.doc-mode .lang-btn { border-color: #aaa; color: #444; }
body.doc-mode .lang-btn:hover, body.doc-mode .lang-btn.active { border-color: #111; color: #111; background: rgba(0,0,0,0.06); }
body.doc-mode .tl-item::before { background: #333; }
body.doc-mode .timeline::before { background: linear-gradient(180deg, #333, transparent); }
body.doc-mode .tl-date { color: #555; }
body.doc-mode .tl-text { color: #333; }
body.doc-mode .big-question { color: #111; }
body.doc-mode .big-question span { color: #333; text-decoration: underline; }
body.doc-mode .question-section { background: #ebe8e0; }
body.doc-mode .film-section { background: #ede9e0; }
body.doc-mode .digital-id-section { background: #e8e8e0; }
body.doc-mode footer { border-top-color: #ccc; }
body.doc-mode footer p { color: #666; }
body.doc-mode .divider { border-top-color: #ccc; }
body.doc-mode .stat-grid { background: #ddd; }
body.doc-mode .scroll-hint { color: #999; }
body.doc-mode .mode-btn { background: #ddd; color: #111; border-color: #aaa; }

/* LANGUAGE SWITCHER */
.lang-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 1000;
  background: rgba(10,10,10,0.95);
  border-bottom: 1px solid #222;
  padding: 8px 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}
.lang-bar span { font-family: 'Courier Prime', monospace; font-size: 11px; color: var(--light-grey); margin-right: 8px; }
.lang-btn {
  background: none;
  border: 1px solid #333;
  color: #aaa;
  font-size: 11px;
  font-family: 'Courier Prime', monospace;
  padding: 3px 8px;
  cursor: pointer;
  transition: all 0.2s;
  border-radius: 2px;
}
.lang-btn:hover, .lang-btn.active {
  border-color: var(--gold);
  color: var(--gold);
  background: rgba(212,160,23,0.08);
}

/* HERO */
.hero {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 100px 20px 60px;
  position: relative;
  background: radial-gradient(ellipse at center, #1a0a0a 0%, #0a0a0a 70%);
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(255,255,255,0.012) 40px, rgba(255,255,255,0.012) 41px);
}
.hero-counter {
  font-family: 'Courier Prime', monospace;
  font-size: clamp(60px, 15vw, 160px);
  font-weight: 700;
  color: var(--red);
  line-height: 1;
  letter-spacing: -4px;
  animation: pulse-num 3s ease-in-out infinite;
  text-shadow: 0 0 80px rgba(192,57,43,0.4);
}
@keyframes pulse-num {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.7; }
}
.hero-unit {
  font-family: 'Courier Prime', monospace;
  font-size: clamp(12px, 2vw, 18px);
  color: var(--light-grey);
  letter-spacing: 6px;
  text-transform: uppercase;
  margin: 10px 0 30px;
}
.hero-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(24px, 5vw, 56px);
  font-weight: 900;
  line-height: 1.1;
  max-width: 800px;
  margin: 0 auto 20px;
}
.hero-title em {
  font-style: italic;
  color: var(--gold);
}
.hero-sub {
  font-size: clamp(14px, 2vw, 18px);
  color: #aaa;
  max-width: 600px;
  line-height: 1.7;
  margin: 0 auto 40px;
}
.scroll-hint {
  font-family: 'Courier Prime', monospace;
  font-size: 11px;
  color: #444;
  letter-spacing: 4px;
  animation: blink 2s infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

/* SECTIONS */
section {
  padding: 80px 20px;
  max-width: 900px;
  margin: 0 auto;
}

.section-label {
  font-family: 'Courier Prime', monospace;
  font-size: 11px;
  letter-spacing: 6px;
  color: var(--red);
  text-transform: uppercase;
  margin-bottom: 16px;
  display: block;
}

h2 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(28px, 4vw, 44px);
  font-weight: 700;
  line-height: 1.2;
  margin-bottom: 30px;
}

p {
  font-size: 17px;
  line-height: 1.8;
  color: #ccc;
  margin-bottom: 20px;
}

/* DIVIDER */
.divider {
  border: none;
  border-top: 1px solid #1e1e1e;
  margin: 0;
}

/* STAT BLOCKS */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 2px;
  margin: 40px 0;
  background: #111;
  border: 1px solid #1e1e1e;
}
.stat-box {
  padding: 30px 24px;
  background: #0d0d0d;
  transition: background 0.3s;
}
.stat-box:hover { background: #141414; }
.stat-num {
  font-family: 'Playfair Display', serif;
  font-size: clamp(32px, 5vw, 52px);
  font-weight: 900;
  color: var(--gold);
  display: block;
  line-height: 1;
  margin-bottom: 8px;
}
.stat-label {
  font-size: 13px;
  color: #666;
  line-height: 1.5;
  font-family: 'Courier Prime', monospace;
}

/* QUOTE */
.blockquote {
  border-left: 3px solid var(--red);
  padding: 20px 30px;
  margin: 40px 0;
  background: rgba(192,57,43,0.04);
}
.blockquote p {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: clamp(18px, 2.5vw, 24px);
  color: var(--accent);
  margin-bottom: 10px;
}
.blockquote cite {
  font-family: 'Courier Prime', monospace;
  font-size: 12px;
  color: #555;
  letter-spacing: 2px;
}

/* FILM SECTION */
.film-section {
  background: linear-gradient(180deg, transparent, #0d0a06, transparent);
  padding: 80px 20px;
}
.film-inner {
  max-width: 900px;
  margin: 0 auto;
}

/* TIMELINE */
.timeline {
  position: relative;
  padding-left: 30px;
  margin: 40px 0;
}
.timeline::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 1px;
  background: linear-gradient(180deg, var(--red), transparent);
}
.tl-item {
  position: relative;
  margin-bottom: 32px;
  padding-left: 20px;
}
.tl-item::before {
  content: '';
  position: absolute;
  left: -34px; top: 6px;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--red);
}
.tl-date {
  font-family: 'Courier Prime', monospace;
  font-size: 11px;
  color: var(--gold);
  letter-spacing: 3px;
  margin-bottom: 6px;
}
.tl-text {
  font-size: 15px;
  color: #aaa;
  line-height: 1.6;
}

/* LINKS SECTION */
.links-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 12px;
  margin: 30px 0;
}
.link-card {
  display: flex;
  flex-direction: column;
  background: #0d0d0d;
  border: 1px solid #1e1e1e;
  padding: 18px 20px;
  text-decoration: none;
  color: inherit;
  transition: all 0.25s;
  position: relative;
  overflow: hidden;
}
.link-card::after {
  content: '→';
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%) translateX(10px);
  color: var(--gold);
  opacity: 0;
  transition: all 0.25s;
  font-size: 18px;
}
.link-card:hover {
  border-color: #333;
  background: #111;
}
.link-card:hover::after {
  opacity: 1;
  transform: translateY(-50%) translateX(0);
}
.link-tag {
  font-family: 'Courier Prime', monospace;
  font-size: 10px;
  color: var(--red);
  letter-spacing: 3px;
  margin-bottom: 8px;
}
.link-title {
  font-size: 14px;
  color: #ccc;
  line-height: 1.5;
  font-weight: 400;
}

/* DIGITAL ID */
.digital-id-section {
  background: linear-gradient(180deg, transparent, #06080d, transparent);
  padding: 80px 20px;
}
.warning-box {
  border: 1px solid var(--gold);
  padding: 30px;
  margin: 30px 0;
  background: rgba(212,160,23,0.03);
  position: relative;
}
.warning-box::before {
  content: '⚠';
  position: absolute;
  top: -14px;
  left: 20px;
  background: var(--black);
  padding: 0 8px;
  color: var(--gold);
  font-size: 18px;
}

/* QUESTION SECTION */
.question-section {
  text-align: center;
  padding: 100px 20px;
  background: radial-gradient(ellipse at center, #100a0a 0%, var(--black) 70%);
}
.big-question {
  font-family: 'Playfair Display', serif;
  font-size: clamp(24px, 5vw, 52px);
  font-weight: 900;
  font-style: italic;
  color: var(--white);
  line-height: 1.3;
  max-width: 800px;
  margin: 0 auto 40px;
}
.big-question span { color: var(--red); }

/* CTA */
.cta-section {
  text-align: center;
  padding: 80px 20px;
  border-top: 1px solid #111;
}
.cta-text {
  font-family: 'Courier Prime', monospace;
  font-size: 13px;
  color: #555;
  letter-spacing: 3px;
  margin-bottom: 30px;
  text-transform: uppercase;
}

/* FOOTER */
footer {
  padding: 40px 20px;
  text-align: center;
  border-top: 1px solid #111;
}
footer p {
  font-size: 12px;
  color: #333;
  font-family: 'Courier Prime', monospace;
}

/* TRANSLATION LAYERS */
.t { display: none; }
.t.active { display: block; }
.ti { display: none; }
.ti.active { display: inline; }

.mode-btn {
  margin-left: auto;
  background: none;
  border: 1px solid #333;
  color: #aaa;
  font-size: 11px;
  font-family: 'Courier Prime', monospace;
  padding: 3px 10px;
  cursor: pointer;
  transition: all 0.2s;
  border-radius: 2px;
  letter-spacing: 1px;
}
.mode-btn:hover { border-color: #fff; color: #fff; }

/* MIRROR LINKS */
.mirror-links { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.mirror-btn {
  font-family: 'Courier Prime', monospace;
  font-size: 10px;
  color: #555;
  border: 1px solid #222;
  padding: 2px 8px;
  text-decoration: none;
  transition: all 0.2s;
  border-radius: 2px;
}
.mirror-btn:hover { color: var(--gold); border-color: var(--gold); }
body.doc-mode .mirror-btn { color: #888; border-color: #bbb; }
body.doc-mode .mirror-btn:hover { color: #333; border-color: #333; }

@media (max-width: 600px) {
  .stat-grid { grid-template-columns: 1fr 1fr; }
  .links-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- LANGUAGE BAR -->
<div class="lang-bar">
  <span>🌐</span>
  <button class="lang-btn active" onclick="setLang('bs')">BS/HR/SR</button>
  <button class="lang-btn" onclick="setLang('en')">EN</button>
  <button class="lang-btn" onclick="setLang('de')">DE</button>
  <button class="lang-btn" onclick="setLang('fr')">FR</button>
  <button class="lang-btn" onclick="setLang('es')">ES</button>
  <button class="lang-btn" onclick="setLang('it')">IT</button>
  <button class="lang-btn" onclick="setLang('pt')">PT</button>
  <button class="lang-btn" onclick="setLang('nl')">NL</button>
  <button class="lang-btn" onclick="setLang('pl')">PL</button>
  <button class="lang-btn" onclick="setLang('tr')">TR</button>
  <button class="lang-btn" onclick="setLang('ar')">AR</button>
  <button class="mode-btn" onclick="toggleMode()" id="mode-toggle">📄 DOKUMENT REŽIM</button>
</div>

</body>
</html>
