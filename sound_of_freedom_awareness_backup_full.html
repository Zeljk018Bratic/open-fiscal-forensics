<script>
const metaData = {
  bs: { title: "Sound of Freedom — Zašto ništa ne znaš o ovome?", desc: "300.000 nestale djece. Dokumentovano. Zvanični izvještaji. Zašto to nije na naslovnim stranama?" },
  en: { title: "Sound of Freedom — Why Do You Know Nothing About This?", desc: "300,000 missing children. Documented. Official reports. Why isn't it on the front pages?" },
  de: { title: "Sound of Freedom — Warum weißt du nichts davon?", desc: "300.000 vermisste Kinder. Dokumentiert. Offizielle Berichte. Warum steht das nicht auf den Titelseiten?" },
  fr: { title: "Sound of Freedom — Pourquoi ne sais-tu rien de cela?", desc: "300 000 enfants disparus. Documenté. Rapports officiels. Pourquoi cela ne fait-il pas la une?" },
  es: { title: "Sound of Freedom — ¿Por qué no sabes nada de esto?", desc: "300.000 niños desaparecidos. Documentado. Informes oficiales. ¿Por qué no está en las portadas?" },
  it: { title: "Sound of Freedom — Perché non sai nulla di questo?", desc: "300.000 bambini scomparsi. Documentato. Rapporti ufficiali. Perché non è in prima pagina?" },
};

function setLang(lang) {
  document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
  event.target && event.target.classList && event.target.classList.add('active');

  document.querySelectorAll('[data-lang]').forEach(el => {
    el.classList.remove('active');
    if (el.getAttribute('data-lang') === lang) {
      el.classList.add('active');
    }
  });

  document.body.dir = lang === 'ar' ? 'rtl' : 'ltr';

  if (metaData[lang]) {
    document.getElementById('page-title').textContent = metaData[lang].title;
    document.getElementById('meta-desc').setAttribute('content', metaData[lang].desc);
    document.getElementById('og-title').setAttribute('content', metaData[lang].title);
    document.getElementById('og-desc').setAttribute('content', metaData[lang].desc);
    document.documentElement.lang = lang;
  }
}

window.addEventListener('DOMContentLoaded', function(){
  try { if (typeof setLang === 'function') setLang('bs'); } catch(e){ console.warn('setLang failed', e); }
});
</script>

<!-- QR CODE LIBRARY + canonical pages URL + robust init -->
<script src="qrcode.min.js"></script>

<script>
function getCanonicalPagesUrl() {
  try {
    var pagesBase = 'https://zeljk018bratic.github.io/sound-of-freedom';
    var href = window.location.href || '';
    var host = window.location.hostname || '';
    if (href.startsWith('file://') || href === 'about:blank' || host.includes('raw.githack') || host.includes('raw.githubusercontent')) {
      var parts = (window.location.pathname || '').split('/');
      var file = parts.filter(Boolean).pop() || '';
      return pagesBase + (file ? '/' + file : '/');
    }
    if (host === 'github.com') {
      var segs = window.location.pathname.split('/');
      var blobIndex = segs.indexOf('blob');
      if (blobIndex !== -1 && segs.length > blobIndex + 2) {
        var filePath = segs.slice(blobIndex + 2).join('/');
        return pagesBase + '/' + filePath;
      }
    }
    if (host === 'zeljk018bratic.github.io') return href;
    var path = window.location.pathname || '/';
    return pagesBase + (path === '/' ? '/' : path);
  } catch (e) {
    return 'https://zeljk018bratic.github.io/sound-of-freedom/';
  }
}

(function createRobustQr(id, rawUrl, size){
  var el = document.getElementById(id);
  if (!el) return;
  var url = rawUrl || getCanonicalPagesUrl();
  try {
    var opts = { text: url, width: size || 200, height: size || 200, colorDark: '#000', colorLight: '#fff' };
    if (typeof QRCode !== 'undefined' && QRCode.CorrectLevel && typeof QRCode.CorrectLevel.H !== 'undefined') {
      opts.correctLevel = QRCode.CorrectLevel.H;
    } else {
      opts.correctLevel = 3;
    }
    new QRCode(el, opts);
    var img = el.querySelector && el.querySelector('img');
    if (img) { img.alt = 'QR code: ' + url; img.setAttribute('aria-label','QR code to open this page'); }
  } catch (err) {
    el.innerHTML = '<a href="' + url + '" style="font-size:13px;color:#333;">Open: ' + url + '</a>';
    console.warn('QR generation failed', err);
  }
})('qr-canvas', null, 200);
</script>
