<script>

function setLang(lang,e){document.querySelectorAll('.lang-btn').forEach(btn=>btn.classList.remove('active'));if(e&&e.target)e.target.classList.add('active');document.querySelectorAll('[data-lang]').forEach(el=>{el.classList.remove('active');if(el.getAttribute('data-lang')===lang)el.classList.add('active')});document.documentElement.lang=lang;}
</script>
<script src="qrcode.min.js"></script>
<script>
function renderRobustQr(targetId, fallbackUrl) {
  var qrCanvas = document.getElementById(targetId);
  if (!qrCanvas) return;
  var url = window.location.href;
  if (url.startsWith('file://') || url === 'about:blank') {
    url = fallbackUrl;
  }
  qrCanvas.setAttribute('aria-label', 'QR code linking to this page');
  try {
    var opts = { text: url, width: 200, height: 200, colorDark: '#000', colorLight: '#fff', correctLevel: 3 };
    if (typeof QRCode !== 'undefined' && QRCode.CorrectLevel && typeof QRCode.CorrectLevel.H !== 'undefined') {
      opts.correctLevel = QRCode.CorrectLevel.H;
    }
    qrCanvas.innerHTML = '';
    new QRCode(qrCanvas, opts);
    var qrImage = qrCanvas.querySelector('img');
    if (qrImage) {
      qrImage.alt = 'QR code for ' + url;
    }
  } catch (error) {
    qrCanvas.innerHTML = '<a href="' + url + '" rel="noopener noreferrer">Open this page: ' + url + '</a>';
    console.warn('QR generation failed', error);
  }
}
window.addEventListener('load', function () {
  renderRobustQr('qr-canvas', 'https://zeljk018bratic.github.io/sound-of-freedom/');
});
</script>
