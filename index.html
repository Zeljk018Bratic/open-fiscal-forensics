function setLang(lang,e){document.querySelectorAll('.lang-btn').forEach(btn=>btn.classList.remove('active'));if(e&&e.target)e.target.classList.add('active');document.querySelectorAll('[data-lang]').forEach(el=>{el.classList.remove('active');if(el.getAttribute('data-lang')===lang)el.classList.add('active')});document.documentElement.lang=lang;}
</script>
<script src="qrcode.min.js"></script>
<script>
(function initQr(id,rawUrl,size){var url=rawUrl||window.location.href;if(url.startsWith('file://')||url==='about:blank'){url='https://zeljk018bratic.github.io/sound-of-freedom/';}var opts={text:url,width:size||200,height:size||200,colorDark:'#000',colorLight:'#fff'};if(typeof QRCode!=='undefined'&&QRCode.CorrectLevel&&typeof QRCode.CorrectLevel.H!=='undefined'){opts.correctLevel=QRCode.CorrectLevel.H;}else{opts.correctLevel=3;}try{new QRCode(document.getElementById(id),opts);var el=document.getElementById(id);var img=el&&el.querySelector('img');if(img){img.alt='QR code: '+url;img.setAttribute('aria-label','QR code to open this page');}}catch(e){var el2=document.getElementById(id);if(el2)el2.innerHTML='<a href="'+url+'" style="font-size:12px;color:#333;">Open: '+url+'</a>';console.warn('QR generation failed',e);}})('qr-canvas',null,200);
</script>
