<div class="share-block"><div class="qr-wrap" id="qr-canvas" aria-hidden="false"></div></div>
<script src="qrcode.min.js"></script>
<script>
// Robust QR generation for index.html
window.addEventListener('load', function(){
  var url = window.location.href;
  if (url.startsWith('file://') || url === 'about:blank') url = 'https://zeljk018bratic.github.io/sound-of-freedom/';
  try {
    var opts = { text: url, width: 160, height: 160, colorDark: '#000', colorLight: '#fff' };
    if (typeof QRCode !== 'undefined' && QRCode.CorrectLevel && typeof QRCode.CorrectLevel.H !== 'undefined') {
      opts.correctLevel = QRCode.CorrectLevel.H;
    } else { opts.correctLevel = 3; }
    new QRCode(document.getElementById('qr-canvas'), opts);
  } catch(e) {
    // fallback: use helper or show text image
    if (typeof window.generateQrFallback === 'function') { window.generateQrFallback('qr-canvas', url, 160); }
    else { document.getElementById('qr-canvas').innerHTML = '<p style="font-size:10px;padding:10px;color:#666;">QR: '+url+'</p>'; }
    console.warn('QR failed', e);
  }
});
</script>
