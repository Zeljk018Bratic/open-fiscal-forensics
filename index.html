function setLang(lang,e){document.querySelectorAll('.lang-btn').forEach(btn=>btn.classList.remove('active'));if(e&&e.target)e.target.classList.add('active');document.querySelectorAll('[data-lang]').forEach(el=>{el.classList.remove('active');if(el.getAttribute('data-lang')===lang)el.classList.add('active')});document.documentElement.lang=lang;}

<script src="qrcode.min.js"></script>
<script>
window.addEventListener('load',function(){var url=window.location.href;if(url.startsWith('file://')||url==='about:blank'){url='https://zeljk018bratic.github.io/sound-of-freedom/';}var qrEl=document.getElementById('qr-canvas');if(!qrEl){qrEl=document.createElement('div');qrEl.id='qr-canvas';document.body.appendChild(qrEl);}try{if(typeof QRCode==='undefined'){throw new Error('QRCode unavailable');}var lvl=(QRCode&&QRCode.CorrectLevel&&typeof QRCode.CorrectLevel.H!=='undefined')?QRCode.CorrectLevel.H:0;new QRCode(qrEl,{text:url,width:160,height:160,colorDark:'#000',colorLight:'#fff',correctLevel:lvl});}catch(e){qrEl.innerHTML='<p style="font-size:10px;padding:10px;">QR: '+url+'</p>';console.warn('QR failed',e);}});
