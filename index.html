<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Sound of Freedom — Zašto ništa ne znaš o ovome?</title>
<meta id="meta-desc" name="description" content="300.000 nestale djece. Dokumentovano. Zvanični izvještaji.">
<link rel="icon" type="image/png" href="bajtebrothers-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@300;400;600&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>/* minimal styles kept */
:root{--black:#0a0a0a;--white:#f4f0e8;--red:#c0392b;--gold:#d4a017}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--black);color:var(--white);font-family:'Source Sans 3',sans-serif}
.lang-bar{position:fixed;top:0;left:0;right:0;background:rgba(10,10,10,.96);padding:10px;display:flex;gap:8px;align-items:center;z-index:1000}
.lang-btn{background:none;border:1px solid #3b332a;color:#cfc6ba;padding:5px 9px;border-radius:3px;cursor:pointer}
.lang-btn.active{border-color:var(--gold);color:var(--gold)}
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:100px 20px}
.hero-logo{width:min(220px,55vw);max-width:320px;height:auto;margin-bottom:28px}
.t{display:none}.t.active{display:block}
footer{padding:40px 20px;text-align:center;border-top:1px solid #111;margin-top:40px}
#qr-canvas{margin:12px auto}
</style>
</head>
<body>
<div class="lang-bar">
  <span>🌐</span>
  <button class="lang-btn active" data-lang="bs">HR/SRB/BS</button>
  <button class="lang-btn" data-lang="en">EN</button>
  <button class="lang-btn" data-lang="it">IT</button>
  <button class="lang-btn" data-lang="de">DE</button>
  <button class="lang-btn" data-lang="es">ES</button>
  <button class="mode-btn" id="mode-toggle">📄 DOKUMENT REŽIM</button>
</div>

<div class="hero">
  <img class="hero-logo" src="bajtebrothers-logo.png" alt="BajteBrothers logo">
  <div class="hero-counter">300.000</div>
  <div class="hero-unit t active" data-lang="bs">nestale djece — dokumentovano</div>
  <h1 class="hero-title t active" data-lang="bs">Zašto <em>ništa</em> ne znaš o ovome?</h1>
</div>

<section id="facts"><span class="section-label t active" data-lang="bs">§01 — Dokumentovane činjenice</span><span class="section-label t" data-lang="en">§01 — Documented Facts</span></section>

<footer>
  <p><span class="t active" data-lang="bs">#BajteBrothers – Do pobjede. Bez koljena.</span><span class="t" data-lang="en">#BajteBrothers – To victory. No kneeling.</span></p>
  <div id="qr-canvas" aria-hidden="true"></div>
</footer>

<script src="lang.js"></script>
<script src="qrcode.min.js"></script>
<script>
window.addEventListener('load', function(){
  var url = window.location.href;
  if(url.startsWith('file://')||url==='about:blank'){url='https://zeljk018bratic.github.io/sound-of-freedom/';}
  try{
    var el = document.getElementById('qr-canvas');
    if(typeof QRCode !== 'undefined' && el) new QRCode(el, {text: url, width:160, height:160});
    else if(window.generateQrFallback) window.generateQrFallback('qr-canvas', url, 160);
  }catch(e){console.warn(e)}
});
</script>
</body>
</html>
